<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Finance OS portable integration checks</title>
<style>body{font:16px system-ui;padding:24px;color:#173b30}iframe{width:100%;height:480px;border:1px solid #ccc}li{padding:5px}</style>
<h1>Portable export integration checks</h1>
<p>Runs only against the synthetic demo on this local server.</p>
<ul id="results"></ul>
<iframe id="preview" title="Demo portal" src="/index.html"></iframe>
<script>
const preview = document.querySelector('#preview');
const results = document.querySelector('#results');
function check(condition, label) {
  const line = document.createElement('li');
  line.textContent = (condition ? 'PASS: ' : 'FAIL: ') + label;
  results.append(line);
  if (!condition) throw new Error(label);
}
preview.onload = () => {
  try {
    const app = preview.contentWindow;
    const before = app.document.querySelector('.kpi strong').textContent;
    const html = app.getCleanPortableHtml();
    const parsed = new DOMParser().parseFromString(html, 'text/html');
    check(!parsed.querySelector('#financeNativeBridge'), 'Native bridge removed');
    check(!parsed.querySelector('script[src], link[rel="stylesheet"]'), 'All code and styles inline');
    check(!parsed.querySelector('[inert], dialog[open], details[open]'), 'Transient UI reset');
    check(JSON.parse(parsed.querySelector('#embeddedState').textContent).accounts.length === 2, 'Demo records embedded');
    check(parsed.querySelector('#view').childElementCount === 0, 'Rendered data cleared before export');
    preview.onload = () => {
      try {
        check(preview.contentDocument.querySelector('.kpi strong')?.textContent === before, 'Standalone export reloads with identical net worth');
        check(preview.contentDocument.querySelectorAll('#nav [data-view]').length === 11, 'Standalone navigation rebuilt');
        document.title = 'PASS — Finance OS portable integration checks';
      } catch (error) { document.title = 'FAIL — portable reload'; console.error(error); }
    };
    preview.srcdoc = html;
  } catch (error) { document.title = 'FAIL — portable export'; console.error(error); }
};
</script>
</html>
