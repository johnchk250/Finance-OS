<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="55%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Inner Luminous Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1" />
    </linearGradient>

    <!-- Ambient Radial Glow -->
    <radialGradient id="ambientGlow" cx="20%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <!-- Ledger Bar Gradients -->
    <linearGradient id="bar1Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <linearGradient id="bar2Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="bar3Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Trend Line Gradient -->
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- F Monogram Gradients -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>

    <linearGradient id="topWingGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="midWingGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bgGrad)" />
  <rect width="100" height="100" rx="22" ry="22" fill="url(#ambientGlow)" />
  <rect x="1" y="1" width="98" height="98" rx="21" ry="21" fill="none" stroke="url(#rimGrad)" stroke-width="2" />

  <!-- Ascending Financial Ledger Bars -->
  <rect x="42" y="60" width="9" height="18" rx="3.5" ry="3.5" fill="url(#bar1Grad)" />
  <rect x="54" y="48" width="9" height="30" rx="3.5" ry="3.5" fill="url(#bar2Grad)" />
  <rect x="66" y="36" width="9" height="42" rx="3.5" ry="3.5" fill="url(#bar3Grad)" />

  <!-- Trend Chevron / Trajectory Line -->
  <path d="M 46.5 57 L 58.5 45 L 70.5 33" fill="none" stroke="url(#trendGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 'F' Monogram Left Stem -->
  <rect x="22" y="22" width="11" height="56" rx="4.5" ry="4.5" fill="url(#stemGrad)" />

  <!-- 'F' Top Horizontal Wing -->
  <rect x="22" y="22" width="54" height="11" rx="4.5" ry="4.5" fill="url(#topWingGrad)" />

  <!-- 'F' Middle Growth Crossbar -->
  <rect x="22" y="42" width="28" height="10" rx="4" ry="4" fill="url(#midWingGrad)" />

  <!-- Peak Security Vault / Sync Node -->
  <circle cx="70.5" cy="33" r="5" fill="none" stroke="#F59E0B" stroke-width="2" />
  <circle cx="70.5" cy="33" r="3" fill="#FDE68A" />
</svg>
